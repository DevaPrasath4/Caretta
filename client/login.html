<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Caretta – Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/login.css" />
  <style>
    :root {
      --brand:#2dd4bf;--brand-dark:#14b8a6;--brand-light:rgba(45,212,191,.08);--brand-dim:rgba(45,212,191,.15);
      --success:#2dd4bf;--success-bg:rgba(45,212,191,.1);--warn:#fbbf24;--warn-bg:rgba(251,191,36,.1);
      --danger:#f87171;--danger-bg:rgba(248,113,113,.1);--bg:#0a0a0f;--bg-2:#111118;
      --surface:#16161f;--surface-2:#1e1e2a;--border:rgba(255,255,255,.07);--border-md:rgba(255,255,255,.12);
      --text:#f1f5f9;--text-2:#cbd5e1;--text-3:#64748b;--text-4:#334155;
      --radius-sm:6px;--radius-md:10px;--radius-lg:14px;
      --shadow-sm:0 1px 3px rgba(0,0,0,.4);--shadow-md:0 4px 12px rgba(0,0,0,.5);--shadow-lg:0 10px 30px rgba(0,0,0,.6);
      --glow:0 0 20px rgba(45,212,191,.15);
    }
    html,body{background:#0a0a0f!important;color:#f1f5f9!important;}
  </style>
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="brand">
      <span class="brand-icon">C</span>
      <span class="brand-name">Caretta</span>
      <span class="brand-tag">W26</span>
    </div>
    
    <!-- Login Form -->
    <div id="loginView">
      <h1>Welcome back</h1>
      <p class="sub">Real-Time Sales Intelligence Agent</p>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@company.com" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required />
        </div>
        <div id="login-error" class="error-msg" style="display:none;"></div>
        <button type="submit" class="btn-primary" id="loginBtn">Sign in</button>
      </form>

      <p class="demo-note">Don't have an account? <a href="#" id="switchToRegister" onclick="toggleView(event)">Register here</a></p>
      <p class="demo-note" style="margin-top: 1rem;"><a href="index.html">← Back to home</a></p>
    </div>

    <!-- Registration Form -->
    <div id="registerView" style="display:none;">
      <h1>Create Account</h1>
      <p class="sub">Join Caretta Sales Intelligence</p>

      <form id="registerForm">
        <div class="field">
          <label for="regName">Full Name</label>
          <input type="text" id="regName" placeholder="John Doe" required />
        </div>
        <div class="field">
          <label for="regEmail">Email</label>
          <input type="email" id="regEmail" placeholder="you@company.com" required />
        </div>
        <div class="field">
          <label for="regPassword">Password</label>
          <input type="password" id="regPassword" placeholder="••••••••" required />
        </div>
        <div class="field">
          <label for="regCompany">Company (Optional)</label>
          <input type="text" id="regCompany" placeholder="Your Company" />
        </div>
        <div id="register-error" class="error-msg" style="display:none;"></div>
        <button type="submit" class="btn-primary" id="registerBtn">Create Account</button>
      </form>

      <p class="demo-note">Already have an account? <a href="#" id="switchToLogin" onclick="toggleView(event)">Sign in here</a></p>
    </div>
  </div>
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <script src="js/socket.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
